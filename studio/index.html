<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NewEra Studio · Dashboard</title>
<meta name="description" content="Generate AI images on NewEra, keep them in your collection, and list them for sale in the marketplace." />
<link rel="icon" type="image/png" href="favicon logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">

    <!-- mobile drawer backdrop -->
    <div class="side-backdrop" id="sideBackdrop"></div>

    <!-- sidebar -->
    <aside class="side" id="side">
      <div class="sb-brand">
        <div class="sb-logo">
          <svg width="26" height="26" viewBox="0 0 32 32" fill="none"><path d="M16 4 L27 25 H5 Z" stroke="#cdff4d" stroke-width="2.2" stroke-linejoin="round"/><path d="M16 12 L21 22 H11 Z" fill="#cdff4d"/></svg>
          <span>NewEra</span>
        </div>
        <button class="sb-collapse" id="collapse" aria-label="Toggle sidebar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
        </button>
      </div>

      <button class="new-chat" id="newChat">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        <span class="lbl">New chat</span>
      </button>

      <nav class="nav" id="nav">
        <a class="nav-item" data-page="Home" href="../index.html">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h4v-6h6v6h4V10"/></svg>
          <span class="lbl">Home</span>
        </a>
        <a class="nav-item" data-page="Marketplace" href="marketplace.html">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
          <span class="lbl">Marketplace</span>
        </a>
        <a class="nav-item" data-page="Collection" href="collection.html">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
          <span class="lbl">Collection</span>
        </a>
        <a class="nav-item" data-page="Community" href="community.html">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
          <span class="lbl">Community</span>
        </a>
      </nav>

      <div class="sb-foot">
  <a class="sb-user" href="profile.html" title="View profile">
    <span class="sb-ava">N</span>
    <div class="meta"><div class="nm" id="sbAddr">Not connected</div></div>
  </a>
</div>
    </aside>

    <!-- main -->
    <main class="main">
      <div class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="Open menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="credits" title="Credits remaining">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M6 3h12l3 6-9 12L3 9z"/><path d="M3 9h18M9 3l-1.5 6L12 21M15 3l1.5 6L12 21"/></svg>
          <span><b id="creditVal">0</b> NEA</span>
        </div>
      </div>


      <section class="center">
        <div class="glow"></div>
        <div class="grid"></div>
        <div class="inner">
          <span class="eyebrow"><i></i> let's get started</span>
          <h1>Your all-in-one <span class="hl">AI creation</span> marketplace</h1>
          <p>Describe what you want to create. NewEra generates it, adds it to your collection, and lets you list it for sale, all in one place.</p>
        </div>
      </section>

      <!-- composer -->
      <div class="composer">
        <div class="comp-row">
          <div class="comp-left">
            <div class="comp-top">
              <span class="spark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg></span>
              <textarea class="comp-in" id="compIn" rows="1" placeholder="Type a prompt to bring it to life…"></textarea>
            </div>
            <div class="comp-controls">
              <div class="model-pick">
                <button class="ctl ctl-auto" id="autoBtn"><svg class="spark" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.6 4.8L18 9l-4.4 1.2L12 15l-1.6-4.8L6 9l4.4-1.2z"/></svg> <span id="autoLabel">Auto</span> <svg class="chev" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button>
                <div class="mp-menu" id="mpMenu" hidden>
                  <div class="mp-search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg><input id="mpSearch" placeholder="Search models…" autocomplete="off"></div>
                  <div class="mp-sec">Models</div>
                  <div class="mp-list" id="mpList"><button class="mp-item on" data-m="Auto"><span class="mp-ic" style="background:rgba(205,255,77,.14);color:#cdff4d"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.6 4.8L18 9l-4.4 1.2L12 15l-1.6-4.8L6 9l4.4-1.2z"/></svg></span><span class="mp-tx"><span class="nm">Auto</span><span class="ds">Best model, auto-selected</span></span><svg class="mp-check" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></button><button class="mp-item" data-m="GPT"><span class="mp-ic" style="background:#fff;color:#0b0b0b"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M22.282 9.821a5.985 5.985 0 0 0-.516-4.91 6.046 6.046 0 0 0-6.51-2.9A6.065 6.065 0 0 0 4.981 4.18a5.985 5.985 0 0 0-3.998 2.9 6.046 6.046 0 0 0 .743 7.097 5.98 5.98 0 0 0 .51 4.911 6.051 6.051 0 0 0 6.515 2.9A5.985 5.985 0 0 0 13.26 24a6.056 6.056 0 0 0 5.772-4.206 5.99 5.99 0 0 0 3.997-2.9 6.056 6.056 0 0 0-.747-7.073zM13.26 22.43a4.476 4.476 0 0 1-2.876-1.04l.141-.081 4.779-2.758a.795.795 0 0 0 .392-.681v-6.737l2.02 1.168a.071.071 0 0 1 .038.052v5.583a4.504 4.504 0 0 1-4.494 4.494zM3.6 18.304a4.47 4.47 0 0 1-.535-3.014l.142.085 4.783 2.759a.771.771 0 0 0 .78 0l5.843-3.369v2.332a.08.08 0 0 1-.033.062L9.74 19.95a4.5 4.5 0 0 1-6.14-1.646zM2.34 7.896a4.485 4.485 0 0 1 2.366-1.973V11.6a.766.766 0 0 0 .388.676l5.815 3.355-2.02 1.168a.076.076 0 0 1-.071 0l-4.83-2.786A4.504 4.504 0 0 1 2.34 7.872zm16.597 3.855l-5.833-3.387L15.119 7.2a.076.076 0 0 1 .071 0l4.83 2.791a4.494 4.494 0 0 1-.676 8.105v-5.678a.79.79 0 0 0-.407-.667zm2.01-3.023l-.141-.085-4.774-2.782a.776.776 0 0 0-.785 0L9.409 9.23V6.897a.066.066 0 0 1 .028-.061l4.83-2.787a4.5 4.5 0 0 1 6.68 4.66zm-12.64 4.135l-2.02-1.164a.08.08 0 0 1-.038-.057V6.075a4.5 4.5 0 0 1 7.375-3.453l-.142.08L8.704 5.46a.795.795 0 0 0-.393.681zm1.097-2.365l2.602-1.5 2.607 1.5v2.999l-2.597 1.5-2.607-1.5z"/></svg></span><span class="mp-tx"><span class="nm">GPT</span><span class="ds">OpenAI's image model</span></span><svg class="mp-check" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></button><button class="mp-item" data-m="Gemini"><span class="mp-ic" style="background:#fff;color:#1a73e8"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 24A14.304 14.304 0 0 0 0 12 14.304 14.304 0 0 0 12 0a14.305 14.305 0 0 0 12 12 14.305 14.305 0 0 0-12 12"/></svg></span><span class="mp-tx"><span class="nm">Gemini</span><span class="ds">Google's image model</span></span><svg class="mp-check" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></button><button class="mp-item" data-m="Grok"><span class="mp-ic" style="background:#000;color:#fff"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg></span><span class="mp-tx"><span class="nm">Grok</span><span class="ds">xAI's image model</span></span><svg class="mp-check" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></button><button class="mp-item" data-m="Z-image"><span class="mp-ic" style="background:#cdff4d;color:#0a0d05">Z</span><span class="mp-tx"><span class="nm">Z-image</span><span class="ds">Fast, high-quality renders</span></span><svg class="mp-check" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></button></div>
                  <div class="mp-soon">More coming soon</div>
                </div>
              </div>
              <button class="ctl" id="ratioBtn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/></svg> <span>1:1</span></button>
              <div class="stepper">
                <button class="st-btn" id="qMinus" aria-label="Less">&minus;</button>
                <span class="st-val" id="qVal">1/3</span>
                <button class="st-btn" id="qPlus" aria-label="More">+</button>
              </div>
            </div>
          </div>
          <button class="gen-big" id="genBig">
            <span class="g-main"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.6 4.8L18 9l-4.4 1.2L12 15l-1.6-4.8L6 9l4.4-1.2z"/></svg> Generate</span>
            <span class="g-cost">10</span>
          </button>
        </div>
      </div>
    </main>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
<script type="module" src="../wallet.js"></script>
<script src="script.js"></script>
<script src="studio-generate.js"></script>
</body>
</html>
