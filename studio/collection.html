<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NewEra Studio · Collection</title>
<meta name="description" content="Your collection of AI images generated on NewEra, owned by you." />
<link rel="icon" type="image/png" href="favicon logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="sell.css">
<link rel="stylesheet" href="community-publish.css">
<link rel="stylesheet" href="sell-prompt.css">
<link rel="stylesheet" href="download-btn.css">
</head>
<body>
  <div class="app">

    <!-- mobile drawer backdrop -->
    <div class="side-backdrop" id="sideBackdrop"></div>

    <aside class="side" id="side">
      <div class="sb-brand">
        <div class="sb-logo">
          <svg width="26" height="26" viewBox="0 0 32 32" fill="none"><path d="M16 4 L27 25 H5 Z" stroke="#cdff4d" stroke-width="2.2" stroke-linejoin="round"/><path d="M16 12 L21 22 H11 Z" fill="#cdff4d"/></svg>
          <span>NewEra</span>
        </div>
        <button class="sb-collapse" id="collapse" aria-label="Toggle sidebar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
        </button>
      </div>

      <a class="new-chat" href="index.html">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        <span class="lbl">New chat</span>
      </a>

      <nav class="nav" id="nav">
        <a class="nav-item" href="../index.html">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h4v-6h6v6h4V10"/></svg>
          <span class="lbl">Home</span>
        </a>
        <a class="nav-item" href="marketplace.html">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1.5-5h15L21 9M5 9v11h14V9M3 9h18M9 20v-6h6v6"/></svg>
          <span class="lbl">Marketplace</span>
        </a>
        <a class="nav-item on" href="collection.html">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
          <span class="lbl">Collection</span>
        </a>
        <a class="nav-item" href="community.html">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20c0-3 2.4-5 5.5-5s5.5 2 5.5 5"/><path d="M16 5.5a3.2 3.2 0 0 1 0 5.4M20.6 20c0-2.4-1.4-4.2-3.7-4.8"/></svg>
          <span class="lbl">Community</span>
        </a>
      </nav>

      <div class="sb-foot">
        <a class="sb-user" href="profile.html" title="View profile">
          <span class="sb-ava" id="sbAva">N</span>
          <div class="meta"><div class="nm" id="sbAddr">Not connected</div></div>
        </a>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="Open menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="credits" title="Credits remaining">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M6 3h12l3 6-9 12L3 9z"/><path d="M3 9h18M9 3l-1.5 6L12 21M15 3l1.5 6L12 21"/></svg>
          <span><b id="creditVal">0</b> NEA</span>
        </div>
      </div>

      <section class="col-wrap">
        <div class="col-head">
          <h1>Your <span class="hl">collection</span></h1>
          <p>Every image you've generated or bought, owned by you.</p>
        </div>
        <div class="col-grid" id="colGrid">
          <div class="col-empty" id="colEmpty">Loading your collection…</div>
        </div>
      </section>
    </main>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
<script type="module" src="../wallet.js"></script>
<script src="script.js"></script>
<script src="collection.js"></script>
<script src="sell.js"></script>
<script src="community-publish.js"></script>
<script src="sell-prompt.js"></script>
<script src="download-btn.js"></script>

<script>
  /* mobile drawer toggle — inline so it always loads */
  (function(){
    var side=document.getElementById('side');
    var menuBtn=document.getElementById('menuBtn');
    var backdrop=document.getElementById('sideBackdrop');
    if(!side||!menuBtn) return;
    function openD(){side.classList.add('open');if(backdrop)backdrop.classList.add('show');}
    function closeD(){side.classList.remove('open');if(backdrop)backdrop.classList.remove('show');}
    menuBtn.addEventListener('click',function(e){e.stopPropagation();side.classList.contains('open')?closeD():openD();});
    if(backdrop)backdrop.addEventListener('click',closeD);
    side.querySelectorAll('.nav-item, .new-chat, .sb-user').forEach(function(el){el.addEventListener('click',closeD);});
    window.addEventListener('resize',function(){if(window.innerWidth>820)closeD();});
  })();
</script>
</body>
</html>
