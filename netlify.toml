# v1 is a static site: real .html pages, no build step. Publish the repo root.
# `command` is set explicitly so the build command saved in the Netlify
# dashboard (`npm run build`, from the explorer era) cannot apply.
[build]
  command = "echo 'static site, nothing to build'"
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
