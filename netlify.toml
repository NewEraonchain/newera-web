[build]
  command = "npm run build"
  publish = "dist"

# Client-side routing: every path must serve index.html or a refresh on /app,
# /docs or /privacy 404s. The status must be 200, not 302 — a redirect would
# change the URL in the address bar.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
