# v1 is a static site: real .html pages, no build step. The Netlify dashboard
# still has `dist` saved as the publish directory from the explorer era, and
# the deploy stage honours that over this file. So the "build" copies the site
# into dist/ and we publish that, which satisfies both.
[build]
  command = 'rm -rf dist && mkdir dist && find . -mindepth 1 -maxdepth 1 ! -name dist ! -name .git ! -name .gitignore ! -name netlify.toml ! -name node_modules -exec cp -r -t dist {} +'
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

# The API is proxied rather than called by hostname, so the site never hardcodes
# where the backend lives. Moving hosts is this one line, not 25 edits across 15
# files, and the backend origin is not exposed to visitors.
#
# CUTOVER: set `to` to the real Render hostname before pushing this.
[[redirects]]
  from = "/api/*"
  to = "https://newera-api.onrender.com/:splat"
  status = 200
  force = true
